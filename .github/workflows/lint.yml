name: Format check

# PR gate for code formatting (prettier). Unlike pre-commit.ci, this only
# CHECKS — it never pushes auto-fix commits to your branch. Run `npm run format`
# locally to fix anything this flags.
#
# ESLint/markdownlint stay as local husky + lint-staged hooks on changed files.
# A full `next lint` gate is intentionally not enforced here: the repo has
# pre-existing eslint warnings above the --max-warnings threshold, and the old
# pre-commit.ci already skipped eslint.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Storybook browser tests
        run: >-
          npm run test:storybook --
          src/components/Slide/Slide.stories.tsx
          src/components/MarkdownFlow/ScrollToBottomControl.stories.tsx
          src/components/MarkdownFlow/ScrollableMarkdownFlow.stories.tsx

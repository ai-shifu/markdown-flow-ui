version: 2
updates:
  # Disable routine version PRs; security updates retain their independent limit.
  # A schedule is required, but it does not control security update timing.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
